schema_version: 1

project:
  name: "jmgs-whmcs-cac"
  mode: "self-hosted"
  target_whmcs_version: "8.13.x"
  target_php_version: "8.3"
  owner: "JMGS"
  timezone: "America/Monterrey"

governance:
  default_management_mode: "api"
  allow_direct_sql: false
  require_backup_before_apply: true
  require_manual_approval_for_prod: true
  require_release_manifest: true

access:
  preferred_transport: "tailscale+ssh"
  ssh_user: "deploy"
  admin_area_restricted: true

environments:
  dev:
    system_url: "https://billing-dev.example.com"
    whmcs_root: "/var/www/whmcs"
    private_cron_path: "/opt/whmcs-crons"
    database_name: "whmcs_dev"
  staging:
    system_url: "https://billing-staging.example.com"
    whmcs_root: "/var/www/whmcs"
    private_cron_path: "/opt/whmcs-crons"
    database_name: "whmcs_staging"
  prod:
    system_url: "https://billing.example.com"
    whmcs_root: "/var/www/whmcs"
    private_cron_path: "/opt/whmcs-crons"
    database_name: "whmcs_prod"

includes:
  settings: "./settings.yaml"
  gateways: "./gateways.yaml"
  domains: "./domains.yaml"
  servers: "./servers.yaml"
  products: "./products.yaml"

ui_tasks:
  - resource: "product_groups"
    tool: "playwright"
    reason: "No asumir AddProductGroup si no está confirmado en API pública objetivo"
  - resource: "servers"
    tool: "playwright"
    reason: "Crear servers/server groups suele ser UI-first"
